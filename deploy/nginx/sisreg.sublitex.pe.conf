# Nginx del host para SIREGG. Se instala una sola vez (ver deploy/README.md):
#   sudo cp deploy/nginx/sisreg.sublitex.pe.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/sisreg.sublitex.pe.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sisreg.sublitex.pe      # agrega el SSL (443) y la redirección
# Si cambias BACKEND_PORT o FRONTEND_PORT en .env, cámbialos también aquí.

map $http_upgrade $siregg_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sisreg.sublitex.pe;

    # Fotos de facturas y logos (el backend acepta hasta 15 MB por archivo).
    client_max_body_size 20m;

    # Backend: /api/... llega al contenedor sin el prefijo /api.
    location /api/ {
        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        # Tiempo real (Socket.IO en /api/socket.io): upgrade a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $siregg_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Leer una factura con IA puede tardar; el WebSocket queda abierto.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Panel.
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
