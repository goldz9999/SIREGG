# SIREGG en el VPS (Nginx del host + Docker).
#
# Nginx (host) recibe https://sisreg.sublitex.pe y reenvía:
#   /api/*  -> 127.0.0.1:${BACKEND_PORT}   (backend: API, Socket.IO, webhook de Telegram)
#   /*      -> 127.0.0.1:${FRONTEND_PORT}  (panel)
# Los contenedores solo escuchan en 127.0.0.1: desde internet se entra por Nginx.
#
# Requiere el repo del backend al lado de este:
#   ~/app_despliegue/SIREGG        (este repo)
#   ~/app_despliegue/facturas-app  (backend, código en la raíz del repo)
# Desplegar: git pull (en ambos) && docker compose up -d --build
name: siregg

services:
  backend:
    build: ../facturas-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      FRONTEND_URL: https://${DOMINIO:?Define DOMINIO en .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3100}:3000"
    mem_limit: 768m

  frontend:
    build:
      context: ./app
      args:
        # Se incrusta al compilar: el panel llama a https://DOMINIO/api
        VITE_API_URL: https://${DOMINIO:?Define DOMINIO en .env}/api
    restart: unless-stopped
    environment:
      PORT: 8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3101}:8080"
    mem_limit: 128m
