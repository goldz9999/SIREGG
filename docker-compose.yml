# SIREGG en el VPS (Traefik + Docker).
#
# Traefik (proxy central del servidor) recibe https://sisreg.sublitex.pe y reparte:
#   /api/*  -> backend  (puerto 3000 del contenedor; Traefik quita el prefijo /api)
#   /*      -> frontend (puerto 8080 del contenedor)
# HTTPS, certificado, redirección HTTP->HTTPS y WebSocket los maneja Traefik.
# No se publican puertos en el host: todo entra por la red externa proxy-net.
#
# Requiere el repo del backend al lado de este:
#   ~/app_despliegue/SIREGG        (este repo)
#   ~/app_despliegue/facturas-app  (backend, código en la raíz del repo)
# Desplegar: git pull (en ambos) && docker compose up -d --build
name: siregg

services:
  backend:
    build: ../facturas-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      FRONTEND_URL: https://${DOMINIO:?Define DOMINIO en .env}
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.siregg-api.rule=Host(`${DOMINIO}`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.siregg-api.entrypoints=websecure"
      - "traefik.http.routers.siregg-api.tls=true"
      - "traefik.http.routers.siregg-api.tls.certresolver=letsencrypt"
      # Gana siempre a la regla del panel para todo lo que empiece con /api.
      - "traefik.http.routers.siregg-api.priority=100"
      - "traefik.http.routers.siregg-api.middlewares=siregg-api-strip"
      - "traefik.http.middlewares.siregg-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.siregg-api.loadbalancer.server.port=3000"
    mem_limit: 768m

  frontend:
    build:
      context: ./app
      args:
        # Se incrusta al compilar: el panel llama a https://DOMINIO/api
        VITE_API_URL: https://${DOMINIO:?Define DOMINIO en .env}/api
    restart: unless-stopped
    environment:
      PORT: 8080
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.siregg-web.rule=Host(`${DOMINIO}`)"
      - "traefik.http.routers.siregg-web.entrypoints=websecure"
      - "traefik.http.routers.siregg-web.tls=true"
      - "traefik.http.routers.siregg-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.siregg-web.priority=10"
      - "traefik.http.services.siregg-web.loadbalancer.server.port=8080"
    mem_limit: 128m

networks:
  proxy-net:
    external: true
