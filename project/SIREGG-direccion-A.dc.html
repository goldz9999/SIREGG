<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/broadsheet-02023546-a095-4dc0-949b-24d519e02120/styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<script src="_ds/broadsheet-02023546-a095-4dc0-949b-24d519e02120/_ds_bundle.js"></script>
<style>body{margin:0;background:#161514;font-family:var(--font-body)}a{color:#8fd3ea}a:hover{color:#c9ecf7}button{font-family:inherit}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div style="min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr);background:radial-gradient(1200px 500px at 70% -10%,#16323c 0%,transparent 60%),#161514;color:#ecebea">
<aside style="padding:var(--space-4) var(--space-3);display:flex;flex-direction:column;gap:var(--space-4);border-right:1px solid #2a2826">
<div style="display:flex;align-items:center;gap:10px;padding:0 var(--space-2)"><span style="width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3fb3d9,#0088b0);display:grid;place-items:center;color:#0b1a20;font-weight:800">S</span><span style="font-family:var(--font-heading);font-size:21px;font-weight:700;letter-spacing:.02em">SIREGG</span></div>
<button style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid #33312e;background:linear-gradient(180deg,#24221f,#1d1b19);color:inherit;cursor:pointer;text-align:left;box-shadow:0 8px 24px #0006,inset 0 1px 0 #ffffff0d" style-hover="border-color:#3fb3d9"><span style="width:34px;height:34px;border-radius:9px;background:#0088b0;display:grid;place-items:center;font-weight:700;font-size:13px">ED</span><span style="flex:1;line-height:1.2"><span style="display:block;font-weight:600;font-size:14px">Empresa Demo S.A.C.</span><span style="font-size:12px;color:#a9a5a0">Administrador</span></span><i class="ph-duotone ph-caret-up-down" style="color:#a9a5a0"></i></button>
<nav style="display:flex;flex-direction:column;gap:2px"><sc-for list="{{ nav }}" as="n" hint-placeholder-count="8"><button style="display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:10px;background:{{ n.bg }};color:{{ n.fg }};font-size:15px;cursor:pointer;text-align:left;box-shadow:{{ n.sh }}" style-hover="background:#ffffff0a"><i class="{{ n.icon }}" style="font-size:19px"></i><span style="flex:1">{{ n.label }}</span><sc-if value="{{ n.badge }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:#ff4f9a;color:#fff">{{ n.badge }}</span></sc-if></button></sc-for></nav>
</aside>
<main style="padding:var(--space-4) var(--space-6) var(--space-8);display:flex;flex-direction:column;gap:var(--space-6)">
<header style="display:flex;align-items:center;gap:var(--space-3)"><div style="flex:1;max-width:460px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:#ffffff08;border:1px solid #ffffff12;color:#a9a5a0;font-size:14px;backdrop-filter:blur(8px)"><i class="ph-duotone ph-magnifying-glass"></i> Buscar gastos, proveedores, RUC… <span style="margin-left:auto;font-size:12px;padding:1px 6px;border:1px solid #ffffff1f;border-radius:6px">⌘K</span></div><span style="flex:1"></span><i class="ph-duotone ph-bell" style="font-size:20px"></i><span style="width:34px;height:34px;border-radius:50%;background:#15495a;display:grid;place-items:center;font-weight:700;font-size:13px;color:#c9ecf7">LR</span></header>
<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;animation:rise .6s cubic-bezier(.2,.8,.2,1) both"><div><div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a9a5a0">Buenos días, Lucía</div><h1 style="font-family:var(--font-heading);font-size:44px;line-height:1.05;margin:6px 0 0;font-weight:600">Setiembre, <em style="font-weight:400;color:#8fd3ea">en orden.</em></h1></div><div style="display:flex;gap:8px"><button style="padding:10px 16px;border-radius:10px;border:1px solid #ffffff1f;background:transparent;color:inherit;font-size:14px;cursor:pointer" style-hover="background:#ffffff0d">Exportar</button><button style="padding:10px 16px;border-radius:10px;border:0;background:linear-gradient(180deg,#5fc0e0,#2aa3cc);color:#08222b;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 8px 24px #3fb3d940,inset 0 1px 0 #ffffff55" style-hover="transform:translateY(-1px)"><i class="ph-duotone ph-plus-circle"></i> Registrar gasto</button></div></div>
<div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:var(--space-4)">
<section style="padding:var(--space-6);border-radius:18px;background:linear-gradient(180deg,#221f1d,#1b1918);border:1px solid #2f2c29;box-shadow:0 24px 60px #0007,inset 0 1px 0 #ffffff0d;display:flex;flex-direction:column;gap:var(--space-4);animation:rise .7s .08s cubic-bezier(.2,.8,.2,1) both">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);flex-wrap:wrap"><div><div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a9a5a0">Gasto del mes</div><div style="font-family:var(--font-heading);font-size:56px;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums">S/ 48,215<span style="color:#8a8682">.30</span></div><div style="margin-top:8px;font-size:14px"><span style="padding:2px 8px;border-radius:10px;background:#45112a;color:#ffc2da">▲ 8.2%</span> <span style="color:#a9a5a0">vs. agosto · S/ 44,560</span></div></div>
<div style="display:flex;padding:3px;border-radius:10px;background:#ffffff0a;border:1px solid #ffffff10"><sc-for list="{{ ranges }}" as="r" hint-placeholder-count="3"><button onClick="{{ r.pick }}" style="padding:6px 12px;border:0;border-radius:8px;font-size:13px;cursor:pointer;background:{{ r.bg }};color:{{ r.fg }}">{{ r.l }}</button></sc-for></div></div>
<svg viewBox="0 0 600 180" preserveAspectRatio="none" style="width:100%;height:190px;display:block"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb3d9" stop-opacity=".45"></stop><stop offset="1" stop-color="#3fb3d9" stop-opacity="0"></stop></linearGradient></defs><path d="M0 45H600M0 90H600M0 135H600" stroke="#ffffff0d"></path><path d="{{ area }}" fill="url(#ga)"></path><path d="{{ line }}" fill="none" stroke="#5fc0e0" stroke-width="2.5" vector-effect="non-scaling-stroke"></path></svg>
<div style="display:flex;justify-content:space-between;font-size:12px;color:#8a8682"><span>15 set</span><span>18</span><span>21</span><span>24</span><span>Hoy</span></div>
</section>
<section style="padding:var(--space-6);border-radius:18px;background:linear-gradient(160deg,#2a1320 0%,#1b1918 55%);border:1px solid #3a2330;box-shadow:0 24px 60px #0007,inset 0 1px 0 #ffffff0d;display:flex;flex-direction:column;gap:var(--space-4);animation:rise .7s .16s cubic-bezier(.2,.8,.2,1) both">
<div style="display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#ffa3c8"><i class="ph-duotone ph-sparkle" style="font-size:16px"></i> Revisión IA</div>
<div style="display:flex;align-items:center;gap:var(--space-4)"><svg viewBox="0 0 80 80" style="width:92px;height:92px;flex:none"><circle cx="40" cy="40" r="32" fill="none" stroke="#ffffff12" stroke-width="8"></circle><circle cx="40" cy="40" r="32" fill="none" stroke="#ff4f9a" stroke-width="8" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="115" transform="rotate(-90 40 40)"></circle><text x="40" y="46" text-anchor="middle" fill="#ecebea" font-size="18" font-family="Source Serif 4" font-weight="700">3/7</text></svg><div style="display:flex;flex-direction:column;gap:4px"><span style="font-family:var(--font-heading);font-size:24px;line-height:1.1">4 gastos esperan tu revisión</span><span style="font-size:14px;color:#a9a5a0">2 posibles duplicados · 1 sin RUC</span></div></div>
<div style="display:flex;flex-direction:column;gap:6px"><sc-for list="{{ review }}" as="r" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#ffffff08;border:1px solid #ffffff0d;font-size:14px;cursor:pointer" style-hover="background:#ffffff12;transform:translateX(3px)"><i class="{{ r.icon }}" style="font-size:18px;color:{{ r.c }}"></i><span style="flex:1">{{ r.t }}</span><span style="font-variant-numeric:tabular-nums;font-weight:600">{{ r.a }}</span></div></sc-for></div>
<button style="margin-top:auto;padding:11px;border-radius:10px;border:1px solid #ff4f9a66;background:#ff4f9a1a;color:#ffc2da;font-weight:600;cursor:pointer" style-hover="background:#ff4f9a2e">Abrir bandeja de revisión →</button>
</section></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-4)"><sc-for list="{{ kpis }}" as="k" hint-placeholder-count="3"><div style="padding:var(--space-4) var(--space-4) var(--space-3);border-radius:16px;background:#1d1b19;border:1px solid #2f2c29;display:flex;flex-direction:column;gap:6px;transition:transform .25s,border-color .25s;animation:rise .7s .24s cubic-bezier(.2,.8,.2,1) both" style-hover="transform:translateY(-3px);border-color:#3fb3d955"><span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a9a5a0">{{ k.l }}</span><span style="font-family:var(--font-heading);font-size:32px;font-variant-numeric:tabular-nums">{{ k.v }}</span><span style="font-size:13px;color:{{ k.dc }}">{{ k.d }}</span><svg viewBox="0 0 100 24" preserveAspectRatio="none" style="width:100%;height:30px"><path d="{{ k.spark }}" fill="none" stroke="{{ k.sc }}" stroke-width="2" vector-effect="non-scaling-stroke"></path></svg></div></sc-for></div>
</main></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const V=[1210,1680,720,1890,2010,840,1950,2060,1790,1980,2250,1120,980,1382];
function path(vals,w,h,pad){const mx=Math.max(...vals),mn=Math.min(...vals)*.7;const pts=vals.map((v,i)=>[i/(vals.length-1)*w,pad+(1-(v-mn)/(mx-mn))*(h-pad*2)]);let d='M'+pts[0].join(' ');for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;d+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`;}return d;}
class Component extends DCLogic {
  state={r:'30d'};
  renderVals(){
    const line=path(V,600,180,14);
    const nav=[['Dashboard','ph-squares-four',1],['Revisión IA','ph-sparkle',0,'4'],['Gastos','ph-receipt'],['Comprobantes','ph-files'],['Proveedores','ph-storefront'],['Proyectos y pedidos','ph-folders'],['Reportes','ph-chart-bar'],['Miembros','ph-users'],['Configuración','ph-gear']].map(([label,ic,on,badge])=>({label,icon:'ph-duotone '+ic,badge:badge||'',bg:on?'linear-gradient(90deg,#3fb3d926,#3fb3d905)':'transparent',fg:on?'#c9ecf7':'#cfccc8',sh:on?'inset 2px 0 0 #3fb3d9':'none'}));
    return {nav,line,area:line+' L600 180 L0 180 Z',
      ranges:[['7d','7 días'],['30d','30 días'],['12m','12 meses']].map(([v,l])=>({l,bg:this.state.r===v?'#3fb3d9':'transparent',fg:this.state.r===v?'#08222b':'#cfccc8',pick:()=>this.setState({r:v})})),
      review:[['ph-duotone ph-copy','#ff4f9a','Tambo+ · duplicado','S/ 18.50'],['ph-duotone ph-warning-circle','#ff4f9a','Grifo Primax · falta RUC','S/ 150.00'],['ph-duotone ph-sparkle','#3fb3d9','Sodimac · Materiales','S/ 1,240.00']].map(([icon,c,t,a])=>({icon,c,t,a})),
      kpis:[['Hoy','S/ 1,382.40','▲ 44% vs. ayer','#ffa3c8','#ff4f9a',[3,5,2,6,4,7,5,8]],['Esta semana','S/ 11,240.50','▼ 6.4% vs. semana anterior','#8fd3ea','#3fb3d9',[7,6,8,5,6,4,5,4]],['Empresarial','86%','14% personal','#a9a5a0','#8a8682',[5,6,5,7,6,7,8,7]]].map(([l,v,d,dc,sc,s])=>({l,v,d,dc,sc,spark:path(s,100,24,3)}))};
  }
}
</script>
